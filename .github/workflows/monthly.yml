name: Monthly

# The 7th: the Open-Meteo archive is about five days behind, and a month with
# missing days fails the degree-day source.
on:
  schedule:
    - cron: "17 5 7 * *"
  workflow_dispatch:
    inputs:
      city:
        description: Город
        type: choice
        default: all
        options: [all, yerevan, tbilisi, belgrade, warsaw, lisbon, berlin]
      item:
        description: Статья
        type: choice
        default: all
        options: [all, maintenance, heating, electricity, gas, water, hot_water, sewage, waste]
      period:
        description: Месяц YYYY-MM. Пусто — прошедший
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: monthly
  cancel-in-progress: false

jobs:
  build:
    name: collect, calculate, commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -e .
      - name: Run the pipeline
        # A non-zero exit has written nothing: the commit and the deploy are skipped.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_LOGIN: ${{ secrets.PROXY_LOGIN }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_COUNTRY: ${{ secrets.PROXY_COUNTRY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CITY: ${{ inputs.city || 'all' }}
          ITEM: ${{ inputs.item || 'all' }}
          PERIOD: ${{ inputs.period }}
        run: |
          PERIOD="${PERIOD:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          args=(--run --period "$PERIOD")
          if [ "$CITY" != all ]; then args+=(--city "$CITY"); fi
          if [ "$ITEM" != all ]; then args+=(--item "$ITEM"); fi
          python -m ubc.pipeline "${args[@]}"
          echo "PUBLISHED_PERIOD=$PERIOD" >> "$GITHUB_ENV"
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "данные не изменились"
            exit 0
          fi
          git commit -m "Данные за $PUBLISHED_PERIOD"
          git pull --rebase origin main
          git push origin HEAD:main

  # A push made with GITHUB_TOKEN does not start pages.yml, so it is called here.
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
